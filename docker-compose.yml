services:
  # содержит все сервисы что будут в приложении
  postgres:
    image: postgres:17-alpine
    container_name: psgr
    environment:
      - POSTGRES_USER=${DATABASE_USERNAME}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_DB=${DATABASE_NAME}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - dbnet

  booking:
    build: .
    image: booking
    container_name: booking_dj
    command: "python manage.py runserver 0.0.0.0:8000"
    env_file:
      - .env
    links:
      - 'postgres:dbps'
    networks:
      - dbnet
    volumes:
      - .:/app/www/booking
    ports:
      - 8000:8000
    depends_on:
      - postgres

networks:
  dbnet:
    driver: bridge

volumes:
  postgres-data:
