version: '3.9'

services:

  db:
    image: postgres:16-alpine
    container_name: hotel_db

    environment:
      POSTGRES_DB: hotel_service
      POSTGRES_USER: hotel_user
      POSTGRES_PASSWORD: hotel_password
      POSTGRES_PORT: 5432

    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U hotel_user -d hotel_service" ]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: on-failure

  web:
    working_dir: /app
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hotel_app

    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    environment:
      - SECRET_KEY=django-insecure-g=!@iz^on4z*7n+*xq^90_7y37g%3bb9q_mk2xk83mfqrw0pp$
      - DEBUG=False
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0
      - DATABASE_URL=postgresql://hotel_user:hotel_password@db:5432/hotel_service
      - DB_NAME=hotel_service
      - DB_USER=hotel_user
      - DB_PASSWORD=hotel_password
      - DB_HOST=db
      - DB_PORT=5432

    # Проброс портов: "снаружи:внутри"
    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy

    volumes:
      - .:/app
    restart: on-failure

volumes:
  postgres_data:
