services:
  db:
    image: postgres:16
    container_name: hotel_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: hotel_service
      POSTGRES_USER: hotel_user
      POSTGRES_PASSWORD: hotel_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
